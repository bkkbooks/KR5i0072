front:
  text: 養真集重刋道藏輯要養真集卷上
  hash: sha256:a065a90f18ac1287c77c3a8402a6e8c1d30358d2917506c4f31bdd7e61cb5f20
  markers:
  - {type: page-break, offset: 3, content: '', id: CK-KZ_KR5i0072_02p001a}
body:
  text: 道今夫人要做天地間第一等美事莫如讀書要做讀書中第一等高人莫如學道朱子曰讀書將以求道不然讀做何用至於舉業乃分外事可惜壞了多少人道德經有云立天子置三公雖有拱壁以先駟馬不如坐進此道才為人用而鮮終德為修已而有名道則無名而用之無窮是故君子惟道是學功名富貴皆視如浮雲任其去來而漠然無所動於其中矣或問君子惟道是學有所取益而然歟曰有願聞焉曰學道之人是學其在我者也心可廣身可潤病可愈死可免如是之益益莫大焉又問學道之人果有是益與樂乎而今世人見有學道之人共嗔為迂何也曰道德經有云上士聞道勤而行之中士聞道若存若亡下士聞道大笑之不笑不足以為道白鬢老人曰讀書中第一等高人莫如學道自古及今學道者紛紛成道者寥寥其故何也首要根器高次要讀書多三要遇人早根器不高不能有出世之想讀書不多不能見理即明遇人不早多受旁門小術之誤終不能成大道試看鍾吕及南北祖真俱是頴悟超羣胸藏萬卷更兼早遇仙師是以名標仙籍身出塵凡若三者缺一斷難成道若謂余言有謬君其問諸蓬萊理夫道一而已矣在天曰命在人曰性在物曰理此理流行於天地之間發著於日用之際事事物物皆有當然之理而不容已即有所以然之理而不可易惟循理君子以理觀物是是非非善善惡惡因而付之是謂無我無我則公公則明明則處事當而盡物之性矣若以我觀物則愛憎橫生不免任情任情則私私則昏昏則顚倒錯亂只知有我不知有理也有理斯有氣氣著而理隱有氣斯有形形著而氣隱理無不中也氣則偏矣形又偏矣中無不善偏有不善矣苟求化偏之不善而歸於中之善也須於幾動之始密密省察是發於理之中者擴而充之是生於形之偏者絶而去之久而理自常存欲自消亡天下之理不可不窮也而亦不可勝窮也有要焉辨吾心之惑而已矣辨則明明則誠誠則天下之理得而成位乎其中矣明知一善是中而不致中明知萬法惟心而不了心是惑也明知生死事大而不體取無生明知無常迅速而不了本無速非惑歟理是本有底但加提撕而自有欲是本無底但能照破而自無遏欲存理原非二事遏了一分欲即存得一分理遏了十分欲即存得十分理益人莫大於理而存理者少損人莫大於欲而縱欲者多人之有欲猶樹之有蟲暗食於內不久自斃夫人以欲為樂不知欲猶火也不戢將自焚神明受其熬煎酒色耗其精氣生病生瘡晝夜呌苦浮屠謂死後受罪而不知生前已受之早矣白鬢老人曰周子曰明不至則疑生明無疑也經年窮理之人尚不能認理皆真行理皆當而况未嘗學問之人乎世之因明理而保身者固多因爭理而喪身者亦復不少故禪家又以理為障天地大道無形天地是個有形底道天地不言聖人是個能言底天地聖人吾不得而見之矣未嘗不見經書見經書而能明其理義與見聖人何殊天生我形天賦我性內外皆天我何敢紊我在天中天在我心見天地而效其淸靜與其大道不二少有私意獲罪匪輕形色天性也率天性而行自無人欲之纍日用常則也順帝則而動必無踰矩之愆人之道無時不與天地相合一動一靜是也人之氣無時不與天地相通一呼一吸是也嘗見日入地中心火下降之象月到天心腎水上升之象也仰觀北辰居其所而衆星拱之名曰天樞夫天固有樞以為造化之本人亦有樞以為性命之源均是人也有所謂大人者與天地合其德試察我之心並我之性其合乎天地者有幾合則加勉不合則速改而至於大人不為憂矣天生地成吾人之大父母也天動地靜吾人之大師教也己往聖人天地之肖子也未來聖人天地之慈孫也能愛其親者大德必受命能敬其師者下學而上達白鬢老人曰人不畏天皆因把天看遠了此篇最喫緊處莫過天在我心一語人若真知天在我心敢不畏乎敢不敬乎畏敬既久可以明心可以見心可以成佛可以作祖所患者隨知隨忘耳人生人生者太極也太極動而生陽為火火者神也靜而生陰為水水者精也神火精水妙合而凝在兩腎之間為元氣之根夫吾人未生以前氣禀之淸濁從天所賦人不得而與焉既生以後人品之邪正由人自造天不得而司之天地生人上智固少下愚亦少惟中人最多中人能自强與上智不二中人若自棄與下愚何殊今夫人只知我是父母之所生也不知我與父母與天地皆道之所生也是故君子必求得道而後無愧於天地無忝於天地子貢曰文武之道未墜於地在人非止在春秋之人亦在今世之人非止在今世之人亦在後世之人一人生來有一身一身皆有一真人真人靈妙通天地真人淸靜無埃塵真人自古不增減真人從來莫死生但能養得真人就勝如貧子獲萬金孟子曰人之所以異於禽獸者幾希庶民去之君子存之存之者成聖成賢去之者為禽為獸是去之時即變為禽獸不待死後與來生也今夫天有五行金木水火土是也不止謂之行一時稍止不可謂之行矣今夫人有五常仁義禮智信是也不變謂之常一念稍變不可謂之常矣是五行也是五常也具於人身之中則為五臟心肝脾肺腎是也五臟也者生人之大本也傷此大本則不能以有生是故明醫治之必先調和五臟發於日用之際則為五倫君臣父子夫婦兄弟朋友是也五倫也者天下之達道也廢此達道則不可以為人是故先王教人先明五倫之理而今世人有墮肢體去人倫以求道者彼固不知其非也世人驚以為貴而尊奉之此亦不知其非也白鬢老人曰氣禀之淸濁從天人品之邪正由已此固說得好一時稍止不可謂之行一念稍變不可謂之常說得尤好老人皆曰人上六十一年老如一年人上七十一月老如一月人上八十一日老如一日豫今八十有餘將如之何自今以後多活一日是天假道之一日也敢虛度乎今縱得道已是遲了豈容再遲昔有三個老者言及無常有一老者曰今年酒席筵前會不知來年又少誰又一老者曰你說底遠了今晚脫下鞋和襪不知天明穿不穿又一老者曰你說底還遠了這口氣既然出去不知進來不進來智者不失時勇者不再計今日知道今日就該下手此時得知此時就是下手之時若曰今且不暇姑待異日只恐你要做時𨚫又做不迭了人有三寶曰精曰氣曰神老來之精惟恐竭精竭則死老來之氣惟恐泄氣泄則死老來之神惟恐離神離則死精何以不竭必也遠色乎氣何以不泄必也寡言乎神何以不離必也無欲乎神不可以强留心息相依則神自留矣氣不可以輕泄忘言守中則氣不泄矣精不可以漏失還精補腦則精不漏矣或問人老血氣既衰如何可補曰愼言語可以補肺節飲食可以補脾絶思慮可以補心去嗔怒可以補肝斷淫欲可以補腎請益曰不患不補惟恐補而又損我故嘗曰百日補之不見其有餘一旦損之遂覺其不足視彼草木其葉蓁蓁秋後落葉生理歸根歸根不死來春復生由是觀之生生不已天之道也各歸其根物之理也知其理不悖其道者其惟真人乎故真人之息以踵踵猶根也三冬歸根之時宜靜養之白鬢老人曰心息相依忘言守中還精補腦則三寶固矣愼言語節飲食絶思慮去嗔怒斷淫欲則五臟足矣三寶既固五臟又足有不延年益夀之理乎病病何由而生也皆因妄想而生煩惱煩惱既生則內傷其心心傷則不能養脾故不嗜食脾虛則肺氣必虧故致發嗽嗽作則水氣竭絶故木氣不充髮焦筋痿五臟傳遍而死矣人當妄想萌動之時即疾病發生之時也今人不察必待疼痛著身才為有病而不知非一朝一夕之故其所由來者漸矣人之一身外有六淫風寒暑濕燥火是也內有七情喜怒哀樂憂恐驚是也因七情而病者為內傷而成不足之症因六淫而病者為外感而成有餘之病不足宜補有餘宜泄後天有形之血氣受傷而病者藥石針炙可以治之先天無形之精神內損而病者非反觀靜養不能愈也十大名醫治人身病三教聖人治人心病親朋有病皆知去看自已有病郤不知看若知自看內看無心外看無身心身既無受病者是誰不病者是誰見得分明自然無事常想病時則塵情漸減常防死日則道心自生昔子元有心病遇一高僧謂之曰貴恙起於煩惱煩惱生於妄想夫妄想有三或追憶數十年榮枯恩𡨚及種種閒情此是過去妄想也或事到眼前可以順應郤强生意見猶豫不决此是現在妄想也或期日後富貴如願或望子孫及時登榮與夫不可必成不可必得之事此是未來妄想也三者妄想忽生忽滅禪家謂之幻心能照見是妄遂即消滅禪家謂之覺心故曰不患念起惟恐覺遲念起是病不續是藥又曰貴恙亦是水火不交凡溺愛佳冶而作色荒此是外感之欲或夜思佳冶而成夢遺此是內生之欲二者染著耗散元精若能斷之則腎水自然滋生可以上交於心至於思索文字忘其寢食謂之理障經營職業不憚劬勞謂之事障二者雖非人欲亦損性靈若能緩之則心火不至上炎可以下交於腎故塵不相緣根無所偶反流歸一六用不行子元如其言獨處一室掃空萬緣坐至月餘心疾如失自家有病自家知既知須要早時醫倘若忌醫終諱病無常臨到悔追遲白鬢老人曰諺云心病難醫非難醫也不得其法不行其法耳三教聖人善治心病一語可為患心病者指南誰其信之誰其行之昔余為抱關吏時患脾虛下泄之症五年奄奄一息百藥不效萬無生理因謝絶人事反觀靜坐間較心經一卷百日後經完病愈此余既驗之奇方故敢告之有痼疾者死人當血氣强壯之時馳志六欲無所不為及血氣受傷百病生焉死期將至縱有滿堂兒女也替不得無數金銀也買不得至死方悔遲了誰不怕死當怕之於未死之先若待將死之時而怕死則死難免矣誰不怕病當怕之於未病之先若到有病之時而怕病則病難治矣試觀天下之物有重於性命者乎試思天下之事有大於生死者乎人莫不好生也但不好長生之道人莫不惡死也但不惡取死之事人在世上事事相續必死而後已直等到臨死有甚方法可以躲得不如急早回心將種種塵緣一齊放下做個長生出世之人不亦善乎或問塵緣纒繞日久年深一旦就要放下不亦難乎曰只是你不肯放下是以難說設若你死還有不放下底麼今雖未死權當已死一齊放下有何不妙又問放下個甚麼曰放下四大五藴情識種子真修行人恰似大死一番郤活才好大死人也無世界纒繞也無玄妙道理如此大休歇方為了當朝聞道夕死可矣此吾夫子教人急切之語蓋謂上士聞道了生死於片晌之間也白鬢老人曰昔人云舉世盡從忙裏老誰人肯向死前休若有人能向死前休者不但其死必遲而且可以了生死苦人祇為一個愛字不能除郤愛名利遂為名利所縛愛酒色遂為酒色所縛愛身家遂為身家所縛愛子孫遂為子孫所縛將此真性縛得七顚八倒往來人間受無限之苦受父精母血始結成胎衣胞猶如囹圄拘朿其身母喫熱底如滚湯澆身母喫冷底如寒氷逼體及至氣滿胎全急要撞出必將衣胞先撾抉數日衣胞才破人只知為母底腹痛之苦不知為子底更受無數底苦楚至於分娩口爪底一聲受苦於胎中才盡又有一身之苦隨至內患饑渴外畏寒熱變蒸痘疹相繼而作此童䝉之苦也及至成人事業臨身為君王者憂社稷為士庶者憂身家晝夜憔勞坐卧不安五火俱動焚其天和隨身疾病不禁夫人也始成病苦終至死苦後有報苦厯劫輪轉無有休息釋氏曰愛別離苦怨憎會苦求不得苦今人苦惱都是自作自受有不知是苦而誤入其中者有明知是苦而脫離不得者語曰莫言婚配早婚配後事難了莫言中會高中會後業大了莫言耕種飽耕種後苦多了莫言僧道好僧道後心難了或問世人之苦多在身學人之苦獨在心無繩而自縛無事而自忙要收收不來要放放不下如之何則可曰學人未得真傳其苦有如斯也苟得真傳收放由我何苦之有况學道是個安樂法門凡說下苦便是個外道白鬢老人曰世人常談謂人生下時必口爪的一聲可見從此皆是苦境余謂不然皆因迷了真性縱欲不遂是以百苦叢集若肯回心向道萬物皆備於我樂莫大焉何苦之有性命學道入門先須理會性命二字性有性源心地是也命有命蒂真息是也命蒂要固性源要淸或問性源如何淸曰內外兩忘則淸矣命蒂如何固曰神氣相守則固矣性即神也命即精與氣也太極圖曰無極之真二五之精妙合而凝而人始生焉所謂性即無極之真也所謂命即二五之精也無易子曰性具於心心空一分則性見一分心空十分則性見十分性見則性盡矣是止念即所以盡性也性盡一分則神氣凝一分性盡大分則神氣凝十分為學别無工夫不過從容至之而已大抵工夫全在止念心息相依此法最為直捷何也氣乃神之母神乃氣之子心息相依如子母相見神氣融渾打成一片緊緊密密久久而成大定此之謂歸根復命根深蒂固長生久視之道也邱祖師曰息有一豪之未定命非已有我則曰心有一之未忘息不能定夫人有天地之性有氣質之性天地之性太極之全體也才到陰陽五行處便是氣質之性即此太極之體墮在氣質之中非別有一性也張子曰善反之則天地之性存焉或問善反有道乎曰有願聞焉曰儒曰洗心退藏於密佛曰觀自在老曰復歸於朴是善反之始也儒曰知止而后有定定而后能靜佛曰照見五藴皆空老曰復歸於嬰兒是善反之中也儒曰無意無必無固無我佛曰無眼耳鼻舌身意老曰復歸於無極是善反之至也人性本善有不善者氣質之性也知是氣質而不為其所使便是變化氣質之方八十五歲大老漢每日靜坐無事幹道義明了沒底說經書見了懶待看識得一性是主宰照破萬緣皆空幻散淡逍遙自在活再不與人間扯淡白鬢老人曰無極之真理也性也二五之精氣也命也從古多少大儒發明一理二氣之奧可見天下無無理之氣亦無無氣之理其在人也無無命之性亦無無性之命奈釋道二教弟子各執一端紛紛聚訟究之總因太極之理並未深明是以性命之源裂成兩片遂至釋門崇性學道家重命功分門别戶如道冠僧帽之不同殊令大徹大悟者噴飯吁胡不取此篇而玩索之心人只一個心向外是情向內是性順去是識逆來是智今要將順去向外者轉而逆來向內必也反觀乎蓋反有能回能復之義而觀有能照能了之功人之神在心而心之機在目故目用在內而心亦隨之在內不但在也而且定矣此心一定心火下降腎水上升口餌甘津足躡火晣其妙有不可盡言者人只一個真心因何而妄迷則似有覺則還無我故曰知妄無妄要放即放誠是去個僞敬是去個慢當妄想紛起之時不用止絶直反看其心看他想底是甚麼自可想底了當處即寂學道別無法時常反照便是學無了妄想便是道朱子曰有一分心向裏得一分力有兩分心向裏得兩分力若緊緊收拾不要逐物去了安有不得其正者雖半月間可驗也又曰求放心者非是别求一個心來存著只才覺放心便想此心是我底心須要由我使不得信從他往外去了雖錮蔽之久猛可醒來大嚇一聲百邪皆退繼之以觀心心無繼之以依息息住而神隨之俱住焉此之謂真人之息以踵人之所以異於禽獸者惟此心耳佛言作惡之人來生變為禽獸豫謂喪心之人當時變為禽獸何也形雖是人心已不是人了見境心不動則名不生不生即不滅則此心不為塵緣所縛無縛即解脫矣白鬢老人曰大學正心章前言四樣有所是有心之病則心不得其正後言心不在焉四句是無心之病心亦不得其正究竟並未指出正心功夫教學者無從下手此篇既指出正心之功又說出心正之效條分縷析字字金針吾人誠能遵而行之不但可以希聖希賢並可以成佛作祖有志斯道者胡不勉旃情七情己見前篇喜則氣緩怒則氣上哀則氣消樂則氣散憂則氣結愁則氣下驚則氣亂乖戾失常變生諸病為心腹膨痞為腹脅刺痛為咽喉窒塞為上氣喘急為五積六聚夾血而為癥夾水而為癖痰涎或因之以凝結如絮如膜不可勝紀故善養者攝情歸性乃郤病之良方也情者性之向外而動也聖人養之於未動之先故能以其情順萬物而無情過而不有涉而不流譬如明鏡照物美者物之美也不因之而生愛念惡者物之惡也不因之而生憎心故曰廓然而大公物來而順應大公云者純是天理無一毫人欲之私也順應云者有物必有則行其所無事也定性書曰人之情各有所蔽故不能適道大率在於自私而用智自私則不能以有為為應迹用智則不能以明覺為自然又曰人之情易發而難制者惟怒為甚第能於怒時遽忘其怒而觀理之是非亦可見外誘之不足惡而於道亦思過半矣朱子曰忘怒則公觀理則順二者所以為自反而去蔽之方也得道之人內外空寂靜中反觀了無一物則身寄寰中而心超物外矣白鬢老人曰古人云太上忘情非忘情也攝情歸性也人能攝情歸性在儒謂之收放心在道謂之鍊還丹日久功深自能似佛之如如不動矣思人心要死其機貴活死謂死其欲念活謂活其理趣夫思者心之活機無邪其綱也九思其目也思道為正思物為邪道我固有之也思我固有之道思即是道思到妙處灑然會心優游悅怡始可謂之自得若思索雖深心氣耗竭縱有所見非自得也不思而得者聖人也思則得之賢人也不思不勉之謂誠即赤子不學不慮之良知是也擇善者擇此不思不勉而己矣人心有七孔多為血所錮如要開通非學思不能思有鑽研之義學有印證之功思學兼用何道不得理有未通者如面墻而立思如墻上鑽穴鑽得一穴透得了一穴之明先小後大久則并其墻而去之則豁然大通無復障礙矣禮云儼若思儼則不苟若則不苦不苟不苦可謂善思也矣君子思不出其位謂之思但出其位則謂之念思是入道之門念是障道之根白鬢老人曰儒曰思釋曰參道曰悟皆用心求道之名也少年要用心中年要養心老年要息心則功夫得其當矣儒曰化釋曰了道曰得則功夫無可用矣念只因不覺忽然念起是謂無明無明起故謂心為念心實不動觀心至此其念自止止念不難能反諸一念未起之前則念自不續矣未起以前渾然無極而今要會一念不起便是當察念之所由生也因現在生過去因過去生未來現在若無心過去自然了人我之見固是念法愛之見亦是念必盡除之而後可用心止妄念妄念反覺多試看他念甚其念自消沒修真要止念止念要觀心觀心心不有心無境自空心境既然無止觀亦何存圭峯曰密密覺察勤勤觀照習氣若起當處即休切莫隨之免落凡夫縱情亦莫減之免墮二乘夫圓宗頓教畢竟如斯但與本性相應覺知自然無間參同契曰耳目口三寶閉塞勿發通委志歸虛無無念以為常即心得無心者不滅心相而分别也既念而無念者以念無自性緣起即空也白鬢老人曰用心止念未必能止即使止住念去止存此止獨非念乎猶逐張三而留李四也初學之人每受此病然則如何而可必也坐忘乎忘則無我我尚然無誰來起念好人心各有所好好者心之所獨注有不期然而然者竟不知其所以然者也夫以一念而分人品之高下一時而定終身之成敗不可不愼也使其所好者仁義也禮樂也詩書也不問而知其為賢也使其所好者佚遊也博奕也酒色也不問而知其為廢人也使其所好者苑囿也漁樵也不問而知其為細民也使其所好者鬬訟也驕傲也兵刃也不問而知其為凶人也凡好玩樂戲耍者其失有五焉一曰䙝體二曰勞神三曰傷財四曰失時五曰誤事縱極精巧不能致遠是以君子不為也白鬢老人曰大凡人之偏好皆從無始劫帶來種子非徹悟以後要改甚難身人之一身前有三宮曰泥丸宮絳宮黃庭宮為神氣棲泊之所後有三關曰尾閭關曰夾脊關曰玉枕關為神氣通暢之路孟子曰堯舜性之也湯武反之也又曰湯武身之也只是反求諸已而已矣湯武能反求湯武身中有個堯舜吾人能反求吾人身中都有堯舜反觀其身氣在其中矣反觀其氣神在其中矣君子以身任道故身修而道立小人以身循欲故欲滋而身亡楞嚴經曰一門深入入一無妄彼六知根一時淸靜人之不能得道者皆為形所纍也欲除此纍須知此身是不牢之物最苦之軀無主之形膿血尿屎之袋渾身內外無一點好處為甚麼你要吃好的穿好的每到人前誇伶俐賣俊俏指使底人意亂心迷把世上人都被弄壞了死了生生了死從無量劫來受過無數苦惱終無出期我今立志學道把你始末緣由都看透了再不受你迷惑再不受你指使漸作人空慧頓用捨身法墮肢體黜聰明抱而弗離道可幾乎仙家修身必返其體神即氣凝氣即神注性命䨥修道器相乘形神俱妙與道合真白鬢老人曰老子云外其身而身存長春真人云百計以養身即百計以昧心再兼看皮囊歌自能全身放下脈人身之脈正經一十有二奇經有八惟任督二脈係人之生死凡夫任脈之在腹者從下而上行督脈之在背者從上而下行前後間隔化機無本遂以禀氣之淺深為夀命之修短仙家識得任總諸陰之會督統衆陽之綱二脈若通百脈皆通故退陰符進陽火而行河車運轉之法其法凝神入氣穴是謂歸根神氣相守抱一勿離逮夫靜極而動是神復乘氣根而上升於泥丸於是河車之路始通要知河車之路即吾身之任督二脈也氣之始生也鬱蒸於兩腎之間泛溢於五腧之上乃經水亂行不由溝洫也吾急以神斡歸尾閭而上至於夾脊夾脊難過舌柱上腭使之上風府而直至泥丸神與氣交會於此其疏暢融液可知少焉變為甘露急將舌放自鵲橋而下通開會咽過重樓遊絳宮復歸於所藏之處而休焉如此循環灌注久之純熟氣滿三田上下交泰所謂常使氣通關節透自然精滿谷神存白鬢老人曰其法以下數句萬卷丹經不能出此出此便是旁門老子所謂致虛極守靜篤萬物並作吾以觀其復正謂此也寶之祕之尤願與上等根器者篤行之塵世搖動之謂塵變遷之謂世世有治亂治世貴才而見亂世貴德而隱人有老少少年貴學而勤老年貴養而靜唐虞之世有許由孰憂孰樂叔季之世無嚴光孰淸孰濁吾人涉世如渡河凡有陷溺處要知避之良驥至捷常受風塵之苦玄龜雖靈難逃刳腸之禍相彼飛鳥乘風而起擇木而棲何其適也只因貪食誤入於籠求脫不得今夫爵祿亦人之樊籠也歟春秋不用孔子春秋之不幸後世之大幸也玄德能用孔明玄德之大幸也孔明之不幸也古人所行之淑慝與今人所行之是非並自已所行之得失事屬已往俱是塵世中之精扯淡說著何為念著何益不說不念則心靜矣心靜便是道今日之灑脫處皆從先年之不如意得來今日之不如意處安知非異日之灑脫乎白鬢老人曰心靜便是道可見道不遠人世人之不得意處正高人之得意灑脫時也參參名利學道之未得者皆妄念之不絶有以障之也妄念之不絶者皆名利之難忘有以牽之也苟欲絶妄念必先把名利照破而後可名為造物之深忌利是人情所必爭故名利殺人甚於戈矛何也戈矛殺人人知避之名利殺人死而不悔古之有道者多為𦍕狂蓋不欲人知也今之人但有寸長而欲表暴於世者陋矣君子學道將一切好勝逞能之心俱都忘盡暗暗潛修道明德立猶未能焉故曰君子之所不可及者其惟人之所不見乎利之為物也無德而使人親無火而使人熱無權而使人不憚其勞無情而使人一刻不忘使學道者見之而敗德使治世者見之而枉法自古人心國法多為利所害天下有大害藏於大利之中而人不知非不知也為利所昏也犯法之贓猶犯病之食也竊取時惟恐其不多敗露時惟恐其不少一物也何前後之異若斯也利與害相隨故也設若見利時即思有害而苟取之念必然可息矣君子積德德能潤身亦能榮身故大德者位祿名夀不求而自至小人積財財能養身亦能害身故財多者憂患恐懼欲去而不能白鬢老人曰名為造物之深忌固說得好利之為物以下數句尤說得透骨透髓商賈聞之亦當點頭况士大夫與學道之人乎色今夫天地一大夫婦也能生萬物夫婦一小天地也能生男女大抵人道通乎天道順施之可以生子逆取之可以成仙古仙有曰子要不老還精補腦腦也者諸髓之海也淫佚之精是諸髓之所化而出也好色之人多患頭痛腦空是也噫油盡燈滅髓竭人亡楚館秦樓非樂地也陷人之罟獲也歌妓舞女非樂人也破家之鬼魅也人都怕鬼獨不怕家中有粧扮之鬼鈎人神魂人都怕虎獨不怕床上有同眠之虎吃人骨髓人都怕蛇獨不怕衾中有纒人之蛇吸人血氣人都怕賊獨不怕夜間有盜陽之賊害人性命色之害人也大矣哉非不知戒也戒而又犯將以為美乎殊不思耳中有垢目中有眵鼻中有涕口中有涎腹中有尿屎陰中有濃血腥臊臭穢處處不潔焉含簧巧媚詐為親愛其實狠毒無知愚人為之心醉圖取片時之歡不顧百骸之枯敗德損身為害最大應當遠離如避盜賊賊劫人財盡者窮色盜人精竭者死白鬢老人曰道祖詩云二八佳人體似酥腰懸利劍斬愚夫雖然不見人頭落暗裡教君骨髓枯吁中年以後之人尚不能深信此言而况少年乎而况無知之少年乎事事有不可以行諸身者即不可以萌諸心有不可以對人言者即不可以告天知就此四不可時時檢點則近道矣天下事機會難逢可為者不可自諉自諉者無功不可為者不可强為强為者取敗事之來也莫不有理君子論是非小人論利害人當無事時心要常在腔子𥚃不可暗中妄想有事時心要專在理上不可强從已見身上事少自然苦少口中言少自然禍少腹中食少自然病少心中欲少自然憂少天下至難為者其事有二莫如過海與上陳人猶不畏其難而有為之者至於學道有反求即得之易不似過海之險也有天理自然之安不似上陳之危也既易且安而人鮮有為之者何哉白鬢老人曰高明人之事多從外來且能就事了事癡愚人之事多由內生偏會就事多事高明人事來應之以理自然如庖丁之解牛官止神行癡愚人事來應之以私自然如鷸蚌相持漁人享利物萬物之有生於無凡人之情著於有能究常無固難常無其有更難人要欲立常無之地必主以性主以性則未始有物已忘而物自化物雖滿前常歸於無矣龎居士曰但自無心於萬物那怕萬物常圍繞人有妖人物有妖物皆能迷人彼豈能迷人哉還是人自迷之也百字碑曰真常須應物應物要不迷見物之美者而生一愛念此心便為他引去即是迷了看透一物不受一物之迷看透萬物不受萬物之迷金剛經曰一切有為法如夢幻泡影如露亦如電應作如是觀天下事事物物自有個停停當當底道理一毫私意用不得故曰天下何思何慮是故君子就事了事而不生事因物付物而不著物程伊川曰人於外物奉身者事事要好只有自己一個身與心郤不要好苟得外物好時而不知自己身與心已先不好了也今夫人房舍衣服飲食器皿多恥不如人至於學問不如人良心不如人郤不知恥抑獨何哉弗思甚也白鬢老人曰己忘而物自化可見內因有己外才有物內已若忘外物自化世人棄真覔假尚曰豫智我論語記孔子絶四而以無我終之蓋謂意必固皆因有我而言也惟我無則意必固與之俱無矣我是衆私之根也無我則根斷而衆私不生矣今人存心制行有一不為我者乎不利於我即功略蓋世見以為分外也而置之矣有利於我即升斗錙銖裂形隕身而亦狥之矣我之為害何大也惟無我則私化行端且忘形骸矣有何物之纍哉遍索諸形骸之內何者是我我見既無得大解脫永嘉集曰無明不了妄執為我我見堅固貪嗔邪見橫計所有生諸染著知身是幻了無自性色即是空誰是我者一切諸法但有假名無一真實四大五藴一一非我和合亦無內外推求畢竟無人詳看我字從二戈而成一正戈一反戈狠毒殺傷之禍皆因有我而起也故心於道者先要無我白鬢老人曰世人之所謂我非真我也識神之作崇耳昔人云無量劫來生死本癡人認作本來人假學道之士先要認得真假而後可以入道矣嘗觀作戲者窮通得喪離合悲歡外像宛然心內坦然彼何所得能不動心若斯也彼明知形像假粧情境假作互換互移而無損益於已也學者觀之可以悟道焉又見提偶者手舞足蹈恍若人形不知者觀偶觀線郤不思線上有人提而後能動倐爾人去偶線俱在而不能動今夫人之形骸其偶乎氣血其線乎真性其人乎又見耍戲法者變名易質以炫觀者庸愚見之目炫心惑稱為奇妙世間一切有為之法你來哄我我去哄你顚倒倒顚與耍戲法者何異見之而目不炫心不惑則近道矣又見挑燈影者燃燈擊鼓衆人齊來看影其心與目俱隨影轉丟下自巳一個空殼郤不知看及至油盡燈滅種種幻態皆歸於無智者觀之可以悟道當其無而生有也有亦非有及其有而歸無也無亦非無夫何以故緣會之有有無自性故言非有以破常見性空自無無顯真體故言非無以破斷見小而晝夜生死大而元會運世皆可觸類而旁通矣學道者須知一性是真萬緣皆假一切日用養生之物皆假中之塵垢也胡為乎與凡庸之輩爭多寡較美惡於塵間哉白鬢老人曰優人知戲是假學人認世為真豈學人反劣於優人乎缺悟耳言非有以破常見言非無以破斷見二語尤精人能參透自然不著有無魔日月晦蝕皆為魔障遇一番魔障當生一番智慧惟生一番智慧更得一番進益若不以智慧照破而生煩惱則大事壞矣嘗入寺中見四金剛降八怪此降魔之像也及進大殿見佛端坐其中此洗心退藏於密之像也或問一佛二菩薩其義云何曰陽之數奇陰之數偶世人只知獨修一物豈知得同類而成乎修行之人習氣難忘要學主靜一切情識在將忘未忘之際故有諸魔發現順則令人愛悅逆則令人恐怖應當觀察勿令此心墮於邪網常念惟心無外境界豈有自家愛怖自心耶如是照破境界自滅慨聖道不明邪說蜂起自心迷亂妄稱教師是以山精鬼怪皆得乘隙飛精付人假稱是神無知愚人遂信為真同共烘揚愈說愈神大家著魔終不省悟生作魔民死作魔鬼不可救也白鬢老人曰大凡學道之人著魔者皆因認理不明驟學二氏瞎鍊肓修多受此病惟吾無魔蓋格物致知之功施之於先也誠哉是言鳥巢禪師云心生種種魔生心滅種種魔滅可見總是妄念為之境三界無別法惟是一心動念而生一切境也念若不生境自無了及窮動念念亦空寂即知迷時無失悟亦無得以無住真心不增滅故心因境起借心觀境見物生心雖居山林海島都是塵勞人戀境境弄人心失其正而發狂情逐物物引情神離乎舍而成癡好境歹境總是境境雖沓來而非有邪念正念皆屬妄念縱分起而亦無勿謂五欲為樂迷而忘返必至傷身而傷命當知一性是真抱之弗離郤能希賢以希聖消魔破有濁世變作浮土歸根復命凡身結成聖胎三界唯心所作何不將心先了六塵借識而入直要把識頓絶赤子渾然無識塵緣滚滚永無可入之竇真人純然是智法界朗朗盡是了妙之鄉白鬢老人曰境無苦樂從心所起同一嶽陽樓有心曠神怡之人即有感極而悲之客昔人云神仙無別法只生歡喜不生愁非道德深厚者難以語此識本來之性真淨明妙虛徹靈通迥出思識之表無異同無分別悟之則菩提岸迷之則生死海小兒未識父母謂之朴能識父母謂之疵疵者心病也見識一長發熱是心病而身隨病也由是而生分別是識領納在心是受思念是想貪著是行污穢是色如若降伏識神莫如變識為智何哉識嘗逐境而忘返智能了境而不著逐境不了何智非識了境不著何識非智切要而言止此一心放去是識收來是智但有分別即墮情識稍有攀緣即是妄想不如直下盡了才得淸淨白鬢老人曰小兒才識父母已露神伎倆見識一長是心病知此病者幾人逐境是識了境是智放去是識收來是智字字指得分明的確過有心失理之謂惡無心失理之謂過語曰人非聖人孰能無過此言可以恕人不可以恕已蘧伯玉行年五十而知四十九年之非豫今行年八十有五八十四年之非能盡知乎已往之非猶且不知近日之非未易知也何哉迷則執非為是悟則見是猶非省不止三誤豈容再朱子曰日用間知此為非即不如此便是去病之方若問何由而能不如此便是騎驢覔驢學者在淨修口業身業意業三者而已無口過易無身過難無身過易無意過難有志者必就難處用力速改而後可與入道也已或問人有罪可懺乎曰昔者所作無大無小內外求之了不可得名真懺悔又問人有誓願怕犯何如曰迷則說誓悟則全無今試求之誓願安在得大解脫白鬠老人曰儒理去非存是禪理是亦不著因不著方能解脫善善也者太極一動所生之陽也人得之以為性故人性皆善修養之家要養得陽在天之陽生於十月純坤之後規中真息是也釋氏為示勸懲說天堂地獄善惡因果分毫不爽必得異日與來生也吾夫子止曰上達下達坦蕩蕩長戚戚夫上達者日進於高明非天堂而何下達者沉溺於卑污非地獄而何坦蕩蕩者隨在無非樂地福誰如之長戚戚者到處俱是陷穽𡾹莫大焉蓋作善作惡之時即受福受孽之時捷如影響不待異日與來生也或問禪者曰天堂地獄是有是無曰欣怖在心善惡成境但了一心自然無惑問心如何了善惡都莫思量或問為善與學好有以異乎曰無以異也問其目何如曰耳不聽淫聲是好耳目不視邪色是好目口不出非言是好口心不起妄念是好心手不取非禮之物是好手足不踏非禮之地是好足學堯舜之道以治其民者是好君學伊呂之道以事其君者是好臣學孟母擇鄰以教其子者是好母學會參養志以奉其親者是好子又問今之所謂修路修廟修來生者果有好處乎曰吾聞聖人有言曰自天子以至於庶人一是皆以修身為本凡捨身而有修者是之謂不知本白鬢老人曰太極一動所生之陽為性可為天命之謂性第一注欲養此陽又指出規中真息是也可謂合盤托出鮮能知味能修身內者幾人身外之修宜乎衆矣夢夢何為而作也總是沉迷不醒一個識神變作種種幻境三界四相惟一夢心夢中變異無中生有止作夢時苦樂身受忽然覺來一切頓無非覺始無本來無故證道歌曰夢𥚃明明有六趣覺後空空無大千山河天地皆夢中境也王侯將相皆夢中人也三教聖人皆先覺人也三教經書皆解夢書也苟知世事皆空生死一夢無𦊱無礙名為覺了昔者白雲先生睡醒金勵問曰先生以一睡收天地之混沌以覺來破古今之往來妙哉睡也亦有道乎曰有道凡人之睡也先睡目後睡心吾之睡也先睡心後睡目吾之醒也先醒目後醒心目醒因見心心醒不見世不見世并不見心睡無心醒亦無心勵曰吾欲學無心如何則可曰對境莫認心對心莫認境如是已矣焉知其他覺來無所知知來心愈困堪笑塵世中不知夢是夢白鬢老人曰心醒不見世可見著境者皆在夢中鬼夫天下之人一半為鬼所迷一半為人所惑交相鼓煽幾盈天下高明者以明言救之而不從在上者以法𣓏之而不止邪說日熾日盛將來不知所終矣鬼是既死底人人是未死底鬼而今之神皆古之人也盈天地間無處不有鬼神非但天地間有鬼神人身中亦有鬼神何以知之人性生於陽而形生於陰陽則為神陰則為鬼攝情歸性者神之道也狥情喪性者鬼之事也俗語云人有一分陽不成鬼有一分陰不成仙誠哉是言也夫人也者陰陽之交鬼神之會也倐而向善神啓之也倐而作惡鬼使之也君子愼獨察善惡之機辨鬼神之道也白鬢老人曰攝情歸性不求神而神矣狥情喪性不覺鬼而鬼矣君請擇於斯二者神人之真性即人之元神也以其靈明而莫測妙應而無方故名之曰神謂之元者所以别於後天思慮之神也神來入身者生神去離身者死何以知神來念止神即來何以知神去念動神即去形者氣之宅也氣在則形不衰氣者神之母也氣在則神不散人為善則神聚而靈人為惡則神散而昏人有病則神離形而不受其苦人有難則神先去而不當其殃人一息不得神則一息不全人有三谷其虛如谷而神居之故曰谷神上曰天谷泥丸是也為天根神之本宮故神居天谷則精化氣氣上升九年天宮滿而天門為之開通矣中曰應谷絳宮是也為布政之明堂故神居應谷則耳有聞目有見五官效職而百骸為之從令矣下曰靈谷丹田是也為藏修之密室故神居靈谷則視者返聽者收神氣相守而營魄為之抱一矣白鬢老人曰元神二字說得極明白不然必認後天思慮之神為神矣念止神即來念動神即去尤為下手口訣有病則神離形而不受其苦有難則神先去而不當其殃非神化之人斷不能道神化之妙世之津津論神者何嘗夢見
