body:
  text: 氣凡人之氣前升後降眞人之氣後升前降氣之有出有入謂之凡息不出不入謂之眞息葢凡息旣停而眞息自動息之所以停者非强閉之不出也乃虛極靜篤心愈定而氣愈微耳其法行住坐卧攝心歸靜未來不想旣往不思久之神與氣會情與境忘神凝氣結止有一息腹中轉旋不出不入名曰胎息此息旣生牢守虛靜鍊精化氣通透三關灌注三宮是謂眞籥眞爐鼎眞火候也翠虛篇云昔遇眞師傳口訣只要凝神入氣穴者乃吾人胎元受氣之初所禀父母精氣而成者乃吾人各具之太極也眞人神依於息深入於本穴之中綿綿若存無少間斷故得專氣致柔之妙而能觀其復也太上曰天地之間其猶籥乎人得天地之氣以生呼吸者籥之機眞息者呼吸之氣也然此眞息爲受氣之蒂生氣之原呼吸升降互相迭推與陰陽相應刻漏相準故曰周天息數微微數玉漏聲寒滴滴符或問以眞息爲火亦有說乎曰非以眞息爲火也火人神也息乃火之籥也葢籥綿綿不絶卽眞人之息以踵也故曰謾守藥鑪看火候但安神息任天然夫人之一身總是一氣之周流氣通則快氣塞則病故手舞足蹈以養其血氣此法不拘時候得便就行必要專心閉息則神充氣滿而氣易流通仍要怒目切齒則嚴宻武毅而邪念自無行此數次而後靜坐最能除妄消疾此一段功夫大有益處不可忽諸白鬂老人曰仙家秘而不傳者只一命功所謂命者何氣是也此篇旣指出不出不入謂之眞息又說出凡息旣停而眞息自動葢凡息者人生㘞的一聲口鼻通氣所謂後天之氣也後天之氣旣通必得乳食之養少加䝉葢則死矣先天之炁則不然一任母腹之十月胞衣之包裏終不能死其故何也卽此篇所謂腹中旋轉不出不入是也修鍊之人攝情歸性日久功深返本還元如嬰兒在母腹中一般世之所死者不過口鼻無氣耳今活時口鼻已經無氣又死個甚麽世之不信仙道者皆因未明其理未見其人耳精眞人鍊精化氣凡人氣化爲精古人比之爲汞謂其最易走失也喻之以龍謂其最難降伏也學道者固守而不失焉名曰築基神與炁精常欲去人但留得住使之不去可以長生魏伯陽曰凡說抽鉛添汞實是還精補腦或問學道之人多患夢遺鍊睡固難服藥不效如之何則可曰牽轉白牛則不走矣又問人言元牝立則眞精固元牝如何能立曰谷神不死則立矣問谷神如何不死曰無欲靜極則不死矣嘗入元帝廟見龜蛇盤糾夫元帝天神也而居北辰人神獨無所居乎維天之所在紫微居其所而不動天之極立焉造化之所由生也維人之所在黃庭立其所而不遷人之極立焉性命之所由固也故善養者將神火精水凝在一處猶如龜蛇盤繞混成一塊再不間離久之靜極生動眞火熏蒸金精吐艷冲關透頂灌注上下此深根固蒂長生久視之道也白鬂老人曰無欲靜極則谷神不死谷神不死則元牝立矣元牝立則眞精固眞精固則永無走失之患可見夢遺之病皆從色心未退而起人眞能勘破色魔一心淸淨則龍不難降汞不妄走矣若功夫未到之人偶有遺失之病須用牽轉白牛之法其法不拘布帛做一小兜將外腎兜起拴在腰後褲帶之上此病自免教道是個無言底聖人聖人是個有言底道雖曰有言不過以其人之道還治其人之身非强其所難知難能也古之教人者便是教以聖人之道易曰䝉以養正聖功也是訓䝉時卽以學聖望之而學者可不以學聖自勉乎老子曰修已之身其德乃眞舍身而言修者假也今之求仙佛者往往絶人逃世以求之彼以爲有身家有妻子有人事皆能累人故不能成仙成佛也必絶人逃世以爲之殊不知仙佛之道不離身心累能正心修身有身家可居有妻子可樂有人事可以磨鍊故在家亦可以成聖成仙成佛何必棄其所甚便者而必爲其所不便者乎白鬂老人曰說出家可以成仙佛者人或信之說在家可以成仙佛者人皆不信其故何也皆因未眞明其道未眞窮其理耳獨不思仙佛必得出家方成難道聖人亦必用出家方成乎何世人著相之甚也學學也者適道之路也聖經賢傳其路引乎後世邪教大作其言與行果合於聖經賢傳乎但有不合焉卽爲魔說學道者只要收得身心牢固舍身心而別處用功便非正道學道不是說過便罷亦不是知道便了必要實實底向自己心中將一切物欲打掃底乾乾淨淨自然合道學道之志貧當益堅老當益壯或爲客氣所使外物所奪其咎不在氣與物也皆是志不立之病只可責志反覆尋思必見病痛處决烈底斷了譬如抽骨換髓滌腸洗胃叧換了一個人破死底做上一番何事不成聖人之心與人同耳何獨常淸常靜耶此無他只是見得眞養得定惟見得眞一切幻境不能迷亂惟養得定一切好物不能摇奪耳聞目見譬如飲食日日要用日日又要化而去之若化去不盡停滯在腹中久而成病白鬂老人曰世間學者如牛毛大約非名卽利名利之外如此好學如此用功者幾人孚佑帝君云天涯到處人求我走徧天涯不見人誠哉是言也知學莫先於致知致知在格物必學了思思了學至於豁然貫通則知至矣知至則意誠心正可次第而得之矣學者識見有限天下義理無窮故有所知必有所未知及知其所未知更有所未知故詩人有如切如磋之喻人非無知也而眞知爲難人之於珠玉也皆欲以手執之以懷藏之何哉葢眞知其爲寶也學道者如是眞知不患其不力矣人之於砒刀也皆不敢以舌嘗之以身當之何哉葢眞知其能傷人也去惡者如是眞知不患其不淨矣人心本明只爲物欲所蔽便昏了若知是物欲所蔽便是明處緊緊著力主定今日去些明日去些忽生忽滅汝知之乎知而能照則可不生不滅至於不生不滅則心定而性盡矣今汝之氣一出一入汝知之乎知而能依則可以不出不入至於不出不入則氣全而命立矣白鬂老人曰今人論知行多云知易而行難殊不悟所知者皆聖賢之枝葉皮膚耳眞精髓眞命脈曷嘗容易知哉人若眞知必能眞行其不能眞行者仍是假知行知行原是合一之功常常保得知在便是能行若一刻不行便是一刻昏了君子以身體道凡身之所在卽道之所在是故行有行功立有立功坐有坐功睡有睡功隨在無念隨在是功凡有行不來底只是知不眞知理果眞自然樂於循理故曰學不厭知也若見理未眞而勉强果行者意氣能有幾何至於意盡氣弛自當行不去了時當晚夕此君子晏息之時也隨當收歛神室抱一弗離因無世情纒繞亦無元妙道理乍同死人始可謂之大休歇至於夢寢無顚倒而後見主敬之功迨至來朝此君子日新之時也隨當蚤起日求其所未至有人一已百人十已千之志積日成月積月成𡻕不論三年五載而學不至於聖人者未之有也瞬存息養功無間斷於俄頃日就月將學有緝熙於光明或問天理如何全曰必得時時存養又問人欲如何淨曰只是日日消磨人皆有良知良能然良知貴致良能貴充致而充之在於勤學好問而已矣吾人眞性靈而最神念動卽飛不見其形若欲留之須察其宗機常在目宅安於心心常淸靜神氣歸根久生至寶漸漸充盈周流上下徧體生春鍊己純熟對境忘情採取靈藥用陽制陰養成聖胎號曰眞人白鬂老人曰常常保得住知便是行此一語非透重關者不能道破至論晏息日新瞬存息養日就月將天理必時時存養人欲當日日消磨尤爲十二時中忘不得之註言聖賢言語都是實事依而行之可以修己可以治人凡看書必要看通徹體認在自己身上纔有得力處凡人之患在好言人是非學道之患在好執己是予嘗自警曰先年所學多知多能近日所作或詩或文檢點起來都是心病今急要去默而搜尋天下治亂付諸罔聞人間是非置之不論憨憨儍儍兀兀騰騰萬物無有三際皆空塵緣斷盡神氣歸根大道已了何必尋人言言實踐句句相應來日有限切莫因循白鬂老人曰每見世人觀書如巿中馳馬大段落尙不能分明而何敢叩其精細乎何敢望其領悟乎古人云書讀千遍其意方見吁一味匆忙雖涉獵五車何益省察省察者省察我之心一日十二時幾個時在内幾個時在外如是之久自有得力處昔有陳烈自察其心用黑白二色豆以記之起一善念取一白豆置於盤中起一惡念取一黑豆置於盤中初則黑多繼則黑白相半久則白豆多於黑豆又久則純是白豆無一黑豆又久則白豆亦無如此拙法亦有可取者也省察卽是覺照克治卽是改過存養卽是主敬大道雖無修無證塵情要日消日磨人只一個心要在内者是誰底心忽然走在外邊又是誰底心察得分明而後可以進修省察要細宻克治要果决存養要寛裕此三操功夫日日要用至於無功可用則成矣或謂不假施功頓超彼岸此在上智容或有之不敢謂人皆可能也白鬂老人曰此三操功夫卽聖門口訣有志希賢希聖者毋忽敬本性靈光無有生滅亦無增減雖錮蔽日久靈光一耀可以滅千惡而生萬善但保得靈光常在與聖人何殊或問如何保得靈光常在必也敬乎惟敬則保得靈光常在戒愼恐懼固是敬競競業業亦是敬敬則不生妄想不隨昏住允矣存心之要修己之法乎自古聖人以此傳心今夫人正衣冠整思慮自然生敬敬只是主一主一則自無邪僻矣心者身之主也敬者心之至也今人入廟而生敬者爲有神像在上耳郤不思自己身中有個眞眞底鬼神在𥚃面慢不知敬獨何歟程明道曰某寫字時甚敬非是要字好只此是學程伊川曰周先生說一者無欲也尋常人如何便得無欲只在敬字上步步捱去執持得定只如此下手用功時時惺惺莫令昏昧一二日便可見效規矩方員之至也準繩平直之至也人而左規矩右準繩人之至也規矩準繩者禮也禮以敬爲本國無禮則賊盜起而喪其國身無禮則情欲勝而喪其身白鬂老人曰朱子解敬字謂主一無適諸事能主一則心專而神注游思妄念自不能起道家謂之抱元守一禪家謂之不二法門克治聖人有言曰爲學日益爲道日損夫損者損過以就中也損末以還本也損人欲以還天理也凡百私欲必先克己克己如克敵必先知敵所在而後可以進兵自治宜嚴如農夫之去草必先去其根而後無復生之患省察如縛賊一時不可放鬆克治如殺賊必須一刀兩段攻人欲者必如此而後成功克治者去其所本無也須知本來自無非克治而後無也存養者保其所本有也須知本來固有非因存養而始有也白鬂老人曰初進步人必得如此克冶如此加工方是眞學道底人將來可望其成否則悠悠忽忽朝勤暮惰雖到老來亦是塗中漢耳止易曰艮其背不獲其身行其庭不見其人人心之所不能靜者皆欲牽之也夫人一身皆動惟背不動一身皆有欲惟背無欲故文王教人當止心於背不獲其身者忘我也忘我則生欲之根絶矣是靜而止也不見其人者是忘人也忘人則可欲之事冺矣是動而止也程子曰人心必有止無止則隨物是聽何所往而不妄也止有二義一是安住如此而不遷也一是斷絶乎是而不復也二義相須入道之方也白鬂老人曰不獲其身是無我不見其人是無人可見文王當日己有無我無人之垂教豈必待佛入中國而後有無我無人之論哉觀夫人起得身來終日營營絶不知此心去向或有知存者又多用强制强制則反傷其心陰符經云火生於木禍發必尅者此也人心至活而神當平其性順其機以養之不令一毫放逸一毫勉强一毫間斷始可謂之養心之法矣孔子所謂止於至善老之似或存釋之觀自在葢人之神在心而心之機在目目用在内而心卽隨之在内故曰觀自在觀卽反觀也自在者心自在也人若反觀之久不但心在而心竟定矣神氣一定恍若初醒眞如天地交泰其妙有不可盡言者了心經曰吾從無量刼來觀心得道今夫日落室内此暗不知從何而來及點起燈時此暗不知何處去了要知燈無逐暗之理暗無畏燈之情此有彼無毫不費力燈可以喻覺照暗可以喻無明應觀過去諸法恍惚如夢現在諸法迅速如電未來諸法黑暗如漆又觀世間一切有爲之法須臾變壞厯刼以來受過無限苦惱宜速遠離行住坐卧皆應止觀䨥行止是寂靜觀是惺惺或曰如何是明心曰虛心是明心四相俱無萬法皆空如何是見性曰率性是見性不識不知順帝之則白鬂老人曰孟子云學問之道無他求其放心而已易曰成性存存道義之門可見人之一心易放難收學問吃緊處在此功夫下手處亦在此若能刻刻迴光時時反照小則見性明心大則成佛作祖了心經謂觀心得道並非虛語存養存養二字原不相離若不能存養個甚麽存其心便是養其性未發要存養己發要省察私意要克治克治畢又要存養三者遞相爲用一刻不可間斷存心非是用力把持只要淸淨寡欲便是存心須知此心覺卽來不覺卽去必如之何而能常覺常不去乎只在熟之而己矣嘗見養山禽非家中物也只爲養底熟了放之亦不肯去况心是我心中故物養之果熟豈尙有肯去之理乎朱子曰涵養本原之功誠易間斷然纔覺間斷便是接續處只要常自提撕分寸積累將去久之自然接續打成一片耳精氣神得其所養而長者生失其所養而消者死試察一日之間得其所養而長者幾何失其所養而消者幾何則生死可以自知而無用卜爲也學道之功要一日宻似一日一時宻似一時久之自熟與道合一矣白鬂老人曰人能反觀則神氣全歸於内矣神氣旣歸於内焉有不郤病延年之理乎邱祖語錄中醕醕以此引人入道其如不遵不信何存養功夫難得熟熟則打成一片在儒謂之卽心卽理在釋謂之卽心卽佛在仙謂之與道合眞世之半途而廢者總爲心生心生功有間斷吁熟豈易言乎戒夫人自有生以來至於今日皆以情欲用事習染己深一旦求得淸靜事非容易故必以持戒爲先持戒者須淨修三業三業維何身口意是也不殺不盜不淫是淨修身業無妄語無綺語無兩舌無惡口是淨修口業除貪除嗔除邪念是淨修意業視聽言動如顏子之四勿是持戒之至也克伐怨欲如原憲之不行是持戒之祖也子謂君子有三戒葢謂君子常存戒愼之心一生不爲血氣所使也又謂君子有九思葢謂君子心常惺惺不用持戒而自無不戒也楞嚴經曰攝心爲戒因戒生定因定生慧白鬂老人曰淨修三業是禪門之戒四勿九思是儒門之戒初學之人不得不刻刻遵行到家之人不得不粧粧掃郤定定性書曰所謂定者動亦定靜亦定與其是内而非外不若内外之兩忘也兩忘則澄然無事矣無事則定尙何應物之爲累哉心本欲定不能定者念實累之矣若止念存心無所以亂此心者而心自定矣雲門曰初禪念住二禪息住三禪脈住四禪滅盡入乎大定須知定中之道有三焉一曰天生定謂本性寂然原自不動二曰修成定謂涵養純粹自性澄徹三曰宇泰定謂虛心順理行所無事莊子曰宇泰定者發乎天光古之得道者以恬淡養智智生而無以知爲也將睡猶未睡世事無所知身心寂不動便是三昧時在因謂之止觀在果謂之定慧白鬂老人曰兩忘卽顏子之坐忘也能到兩忘何愁不定慧語曰人心如水澄淸之可照鬚眉但一撓之天地易位須知慧中之道有三一曰人空慧謂了悟無生無我無人二曰法空慧了諸陰諸法緣假非寶三日空空慧謂了境智俱空是空亦空修定初者忽發神通或知宿命過去之事或知異日未來之事或得他心智辨才無礙此無他我儒所謂至誠之道可以前知者此也學道至此多有貪著世間名利恭敬俱屬有漏神氣因不能固多致尸解須急棄之有漏之法虛妄故也道德經云俗人昭昭我獨昏昏俗人察察我獨悶悶白鬂老人曰水澄可鑑鬚眉心澄可了生死澄到無我無人處便是生死不相關之地鬼神窺不破之機故曰極樂世界誠一部中庸皆言誠也擇善固執求誠之事也參贊位育至誠之功也至誠之謂聖天道也存誠之謂賢人道也法天始能成人盡人可以合天故曰及其成功一也天地之道惟誠故能生萬物帝王之道惟誠故能化萬民聖賢之道惟誠可以備萬善愼獨致曲是日用間求誠最緊要底功夫至誠可以動天地而格鬼神盈天地間無處不見鬼神人雖不見鬼神未嘗不見天地夫鬼神者天地之靈天地者鬼神之迹君子畏天命卽所以畏鬼神也世之人敢爲不善者只畏人知不畏天知畏人知者僞也小人也畏天知者誠也君子也白鬂老人曰儒家去盡虛僞則爲至誠至誠者聖人也道家鍊盡陰私則爲純陽純陽者眞人也殊不知誠卽眞也眞卽誠也昔人云天下無二道至人無兩心誠哉是言孝孝也者百行之本萬善之原也立身行道終身之孝也服勞奉養一時之孝也古語曰父母全而生之子全而歸之一舉足一開口一動念不敢忘父母無辱身喪心羞親之失可謂孝矣我嘗曰天地全而生之人全而歸之一舉足一開口一動念不敢違天地無辱身喪心逆理之失可謂仁矣父母者一家之天地也孝子事父母如事天地父母愛之喜而不忘父母惡之勞而不怨天地者萬物之父母也人事天地當如事父母富貴利達處之而不踰其則貧賤患難受之而不失其正或問曰父母旣没何以行其孝也曰子之身父母之遺體也謹守之而不失卽所以事父母也人之性天地之降衷也善養之而勿喪卽所以事天地也白鬂老人曰人能成聖則人稱其親爲聖父聖母人能成仙則人稱其親爲仙父仙母人能成佛則人稱其親爲佛公佛母人若庸碌一生吾不知人如何稱其親矣德今世之人得道者鮮矣非道之難得也知之未眞守之不固也入德之功自知幾始崇德之功自誠意始修德之功自遷善始聖人有言曰含德之厚比於赤子夫人之初誰非赤子哉惟能去淨習染還我赤子之初聖人之德如斯而己矣君臣父子夫婦昆弟朋友此五者天下之達道也舍此五者而言道外道也智仁勇三者天下之達德也舍此三者而言德悖德也子曰據於德據者固執之謂惟固執則一得永得而弗失之矣久則熟熟則化而爲仁矣白鬂老人曰朱子曰德者得也行道而有得於心也吾人平日須當痛自檢點果有眞知乎果有眞得乎總有所聞所見不過浮浮泛泛而已有則更當勉之無則自問安乎仁仁者人也人而不仁欲成眞人無有是處吾謂儒之所謂仁卽佛之所謂舍利仙家之所謂金丹也心者仁之舍也仁者心之主也但將此心打掃乾淨隨覺元氣復來四肢百骸無不充暢旋視萬物同一自得之象故曰一日克已復禮天下歸仁爲天地生生之理具於人心謂之曰仁取其能生故也果核之實亦謂之曰仁亦取其能生故也人何不將此生生之理而存養於心哉吳臨川曰仁者夀吾嘗持此觀天下之人凡氣之温和者夀質之慈良者夀量之寛宏者夀貌之厚重者夀言之簡默者夀葢温和也慈良也寛宏也厚重也簡默也皆仁之一端也其夀也宜矣臨川論有仁之一端而且能得夀若併五者而俱有之其夀之長也不問而可知矣仁者樂山夫山之爲物也亘古不遷是凡物之有夀者莫山若也山能常靜仁者常靜靜則神凝氣結精滿形固豈有不夀者哉白鬂老人曰顏子問仁孔子教之以克己復禮行乾之道令其一刀兩段卽禪家所謂頓教也仲弓問仁孔子教之以居敬行恕行坤之道令其循序漸進此禪家所謂漸教也自闕里已用此法教人又何待南能北秀始有頓漸之殊哉靜語曰聖人主靜立人極夫極者人之大中也聖人主靜非以靜爲善而故主之也是萬物無足以撓其心不求靜而自靜也今之求靜者未得眞傳皆曰緊鎖心猿牢拴意馬至於拴鎖不住遂謂此心終不可得而靜也殊不思此不致知之過也致知則明明則見天下之理都是停停當當底一毫私意著不得此所謂知止而后有定定而后能靜靜而后能安也外忘名利則身安内忘思慮則心安人皆曰身安便是福我則曰心安便是道慧可見達摩曰某心未安乞師與安摩曰將心來與汝安可曰覔心了不可得摩曰我與汝安心竟温則曰三際求心心不有寸心覔妄妄原無妄原無處卽菩提是則名爲眞得道吿子之不動心是不得勿求遺棄而不動後世枯槁之士皆吿子之流非見道者誰知其謬白鬂老人曰人能内忘思慮外忘名利則主靜工夫不待言矣若思慮未除名利未斷縱靜片時焉能長久把持與自然看破與未破毫釐之分天壤之異樂樂莫樂於得道一日學道一日快活日日學道日日快活終身學道終身快活學道原是安樂法門是以聖人學而不厭周茂叔教二程氏尋孔顏樂處是樂也在各人身中反尋之而自足孟子謂君子有三樂一曰天倫之樂二曰性分之樂三曰名教之樂其樂在天與人者我不得而必之其樂在我者胡不自盡焉今夫人有不爲人役者乎有不爲物役者乎有不爲形役者乎人必去此三役則可與之言樂矣嘗見芒芒之人筋出力盡但得放下便覺快樂學道之士若能放下其樂倍於世人萬萬矣先年予當盛暑遠行見老者坐於凉樹之下以爲極樂矣予今閒暇坐於凉樹之下不見樂處何哉先年以勞視逸故若是耳意者貧之視富賤之視貴皆若是乎爲人只可素其位而行故能無入而不自得焉凡有願外之心俱屬無益一切扳緣業債是非罪過皆由此願外之一念起可不愼哉白鬂老人曰學道爲安樂法門人多目之爲苦名利是極苦之事人反視之爲樂慧眼與肉眼原該有如此之異太極太極者兩儀之祖也兩儀者天地之祖也天地者萬物之祖也用祖炁以修身則固取祖炁以書符則靈太極在吾人是謂元牝乃眞精妙合自然而成是神氣之根而性命之竅也大要觀天之道執地之行二者盡之矣一陰一陽兩者配合天地之道也日月運行晝夜交光天地之行也故曰天地設位而易行乎其中矣易謂坎離是也聖人知其如此故以乾坤爲鼎器以烏兎爲藥物其中消息盈虛之數則又準之以火候陰符經曰日月有數大小有定神明出焉聖功生焉總而言之盜機逆用盡之矣天地旣判日月運行照耀交光而造化生焉日月者天地陰陽之精神也於卦爲坎離離中之陰是謂烏精坎中之陽是謂兔髓丹法以烏兔爲藥物不過識五臟之精盜其機而逆用之耳是藥物也生産有時節採取有銖兩顚倒有法度其要在於月出庚初鈆生癸後日月交光陰陽和氣自然而成故丹之爲字象日月或問何謂金液還丹曰以其旣失而復得謂之還以其採取水中之金合以己汞而成謂之金液白鬂老人曰太極在天爲理在人爲性兩儀在天爲氣在人爲命其實理外無氣氣外無理可見性命並非在兩處修性卽所以養命猶實腹卽所以虛心也中古聖相傳只是一個中字不偏不倚中之體也無過不及中之用也堯曰允執厥中夫執中兼動靜而言也靜則執此中以存心動則執此中以應事允者信也有因時隨事自然執中無一毫勉强間斷之意舜曰惟精惟一灼見元微曰精始終不二曰一言人必有惟精之見惟一之守而後可以執中允字内己該此意恐人不解故益明言之人心惟危道心惟微有念人心也無念道心也言人心易熾而道心亦易湮没也此言危微之機以惕人欲人之愼於執中也李延平危坐終日以驗夫喜怒哀樂未發以前氣象何如而求所謂中也如是者久之而知天下之大本眞在乎是也故曰學問不在多言但默坐澄心體驗天理若見人欲之私皆消退矣李淸庵曰此中非中外之中非四方之中又非在中之中念頭不起處是也易曰聖人以此洗心退藏於宻白鬂老人曰念頭不起處謂之中淸庵此語可謂畫龍點睛之手延平先生終日危坐以驗夫喜怒哀樂未發以前氣象正是允執厥中日久功深則人欲變爲天理功夫全在洗心退藏學聖古人有言曰人皆可以爲堯舜堯舜是天生底聖人湯武是學成底聖人老君曰我非聖人學而能之或問周茂叔曰聖可學乎曰可有要乎曰有請問焉曰一爲要一者無欲也無欲則靜虛而動直靜虛則明明則通動直則公公則溥明通公溥庶矣乎學道便是學聖人道我固有不從外來聖非絶德可學而至吾人之性與聖人同能盡其性便是聖人學舉業者能中舉人人皆知之學聖人者能至聖人胡不知也吾夫子信己可以爲聖人故學而不厭見世人皆可爲聖人故誨人不倦欲以聖人之道化天下故周流列國欲以聖人之道教後世故刪述六經儒者之所謂聖卽僧道之所謂仙佛也佛者覺也仙者仙也此古時來命名之義也予想佛一字更有說焉佛字從人從弗弗者不也有不爲人欲之義焉人而能爲人之所不爲則可以成佛矣仙字從人從山山者靜也有常定常靜之義焉人能如山則可以成仙矣放下便是佛提起就成仙如何能作聖惟一無二三看來儒釋道皆以無欲而成彼有所貪而爲之者百無一成或問欲學聖人其如習氣難除何曰惟不肯除是以說難若肯除之刻下卽休何也一切習氣皆是虛妄心迷似有心悟則無非悟始無本來無故白鬂老人曰道我固有不從外來聖非絶德可學而至此四語可以開聖門之堂奧長學者之精神孟子生於孔子百年之後願學孔子所以至今人稱孔孟坎離或問易有八卦求道之人多言坎離何也曰乾陽坤陰南北相對此先天之體也乾陽一動便是覔風故乾之中爻直八坤中而止則乾成離坤成坎矣夫南北者天地之兩樞也先天卦位本乾坤所居今退處於無用之地而以坎離代之則後天之用行矣坎之眞炁化而爲鉛卽天一所生之水也離之眞精化而爲汞卽地二所生之火也故男得其精用精者化故順而成人女得其炁用炁者昌故逆而成仙以先天未擾之眞鉛制後天積久之眞汞則相愛相戀如夫婦子母之不忍離皆自然而然有不知其所以然者離爲日日秉陽精而離之中爻卻是陰是陰藏於陽之宅也其在人也少陰之數八男子得之故二八而眞精通少陽之數七女子得之故二七而天癸至豈非陽得陰數陰得陽數而互藏之義因以見之哉故人欲求道必得坎中陽爻復入離之中爻然後可以復乾象而還大道也且夫陰中之陽以動爲主故取坎之期惟愼其動陽中之陰以靜爲主故塡離之後致養於靜白鬂老人曰用精者化世人皆知用炁者昌人皆不知以先天未擾之眞鉛制後天積久之眞汞此二語洩一部悟眞篇之秘得訣者自知取坎之期惟愼其動塡離之後致養於靜尤爲要緊口訣開關人身之中有任督二脈當其在胞胎中其脈常運未嘗間斷神氣混合以通先天及其胎分蒂絶其脈遂分而爲二任脈主陰起於承漿而終於長强督脈主陽起於會陰而終於人中陰陽不交前後間斷泥丸不能與丹田相通丹田之氣不能與尾閭直透關竅不通化機無本以禀氣之淺深爲夀命之修短自其生之時已定其死之日矣古先達人得躋長生者葢有周天升降河車運轉之法使二脈相接循還無端三關開通周流不滯其訣於子前午後盤膝端坐四門外閉兩目内觀湛若止水寂如空室未來不想旣往不思心不生滅氣不出入調息良久注想丹田守氣勿散纔覺丹田氣動卽將鼻息緊閉下腹微脇以意氣通尾閭尾閭通卽將谷道輕提舌拄上腭用意升提徐徐運上泥丸泥丸氣達是謂還精補腦少焉化爲甘露從鵲橋而下卽將舌放自然會咽開通用意輕輕送歸元海此爲一度如此三百六十爲一周天行之日久自然氣機流轉骨節疎通三關漸開二脈尋後泛曹溪路有感卽通入眾妙門元精不走了此一節卽可長生至於抱元契虛脫胎神化別有妙乘實從此權輿也白鬂老人曰調息功久一旦伏住後天之氣積氣開關自然反囘先天路徑所謂尋著來時路也就正孔聖曰君子食無求飽居無求安敏於事而慎於言就有道而正焉君子心專力勤可謂學得其宗矣猶必就正有道者非過謙也是求益也眞有見夫天下之道理無窮一人之學問有限是故大舜聖人也猶必好問而好察邇言舍已從人樂取於人以爲善顏子大賢也以能問於不能以多問於寡有若無實若虛自古以來聖不自聖所以成其爲聖賢不自賢所以成其爲賢今人不然自稱遇師而不察師之眞僞自稱聞道而不察道之淺深語入旁門盲修瞎鍊終無一成彼認假爲眞執迷不悟卽有憐其誤而告之以正道者彼亦不信也易曰一陰一陽之謂道仁者見之謂之仁智者見之謂之智今世諸家談道者皆仁智之見求其本末兼該上下俱盡性命雙修道明德立必待篤好之士常懷就正之心者始可與言道也己有道之士可以成己成物可以泛應曲當譬如洪鐘大叩大鳴小叩小鳴不叩不鳴不叩而鳴則人以爲怪鐘矣叩之不鳴則人以爲廢鐘矣故有道之士因人而施不至失人亦不至於失言也或問而今世上縱有慕道之士其如有道者之難遇何曰世上經書皆有道之所留也就經書而就正者但得不悖其教我者不亦多乎白鬂老人曰就有道而正焉非己有道焉能知人之有道况道有大小之不同邪正之逈異已有正方知人之正已無邪方明人之邪若一味皂白不分逢人求教其不入於旁門外道者鮮矣養眞集跋余嘗謂大修行人必得學禪家參悟用道家功夫敦儒家品行其故何也人不學禪家參悟則心性不能明徹不用道家功夫則神氣不能相抱不敦儒家品行則必至好奇尙怪驚世駭俗而後己是本欲學仙學佛反成魔王妖𡾹試看古今來得正道而修成者固多入旁門而喪身失命者亦復不少故邱祖云試叩禪關參求無數往往到頭空老又云磨磚作鏡積雪爲糧悞幾多年少吁世有躬行深造者必能默契余言丁未花朝日白鬂老人再筆
