body:
  text: 乾隆丁未上元觀燈日白鬂老人王士端題於塵世蓬壺養眞集卷上目錄道理天地人生老病死苦性命心情思念好身脈塵世名利色事物我假魔境識過善夢鬼神養眞集卷下目錄氣精教學知行言省察敬克治止觀存養戒定慧誠孝德仁靜樂太極中學聖坎離開關就正
  hash: sha256:0a208df8300b2ead991928e6c6e3d90f44bc6a9e4774c2f16c6c587bfc50c071
