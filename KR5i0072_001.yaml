body:
  text: 乾隆丁未上元觀燈日白鬢老人王士端題於塵世蓬壺養真集卷上目録道理天地人生老病死苦性命心情思念好身脈塵世名利色事物我假魔境識過善夢鬼神養真集卷下目録氣精教學知行言省察敬克治止觀存養戒定慧誠孝德仁靜樂太極中學聖坎離開關就正
  hash: sha256:7a542c7c33d9aa783794266ba0e307a853c116c78f7a4050a47ead49be21134b
