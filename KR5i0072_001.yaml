front:
  text: 養眞集養眞集序癸卯孟春余自都中來過吾友之邑留止書舍見四壁字帖纍纍宻佈如鱗就而視之乃天地日月之道鬼神人物之理超生長生之術出世入世之法無不備載無不精詳眞醒世之語修身之要也請吾友盡書分類而次集之書成分作上下二卷直將三教眞僞倂自得心法毫無所隱出以示人使見斯集者若能潛玩自然善心發現洞徹精微由是而迷者悟邪者正不誤入於旁門愚者明弱者强不廢功於半塗吾友之集其有禆世道人心者大矣哉吾友道號養眞余老拙不能贊一詞直書爲養眞集以弁其首云爾養眞集序通元理而不通禪必受固執之病通禪理而不通儒多成狂慧之流求其禪儒皆通而又能貫之以道不但今鮮其人卽古之紫衣黃冠恒不多覯丙午夏之日偶過友人趙公齋頭見几上有養眞集一卷因溯其書之淵源乃得之海甸慧福寺寺僧得之陳提臺提臺又得之其家西席遂借歸閱之係隱士養眞子所註惜其不表姓名葢赤松黃石者流也其書由儒悟禪就虛靈而養舍利由禪證道借般若而鍊金丹談空則皆拈花面壁之眞傳論道則無鉛虎汞龍之假借孔顏樂處信手拈來濂洛薪傳隨筆揮出彙三教而同歸總百家爲一轍不作空中樓閣步步階梯修成幻海橋梁頭頭道路驀直行去省多少雲水三千俛首入來便可坐洞天十二因其爲希有之奇書遂全忘我心之固陋始續貂以裁狗繼付棗而登梨採玉探珠全望高明之慧眼飛昇羽化庶酬作者之婆心噫若大乾坤應有知音之客如斯世界豈無見性之人聊染翰而暢言遂無心以成序
